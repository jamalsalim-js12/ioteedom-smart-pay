services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ioteedom
      POSTGRES_PASSWORD: ioteedom
      POSTGRES_DB: ioteedom
    # Host 5434: 5432/5433 are often already taken on local machines.
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ioteedom -d ioteedom"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
